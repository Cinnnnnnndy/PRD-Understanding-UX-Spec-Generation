<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC 偏移量计算器 · 优化后 Demo</title>
<style>
/* 由阶段一 demo-prompt.md（优化模式）生成：锚定原 §A 设计系统基线，落实 O1–O5 + 可访问性。
   单文件、可双击、零依赖——这是"便宜的实验"，工程化版本见 phase2/。 */
:root{
  --bg:#1e1e1e;--quote:#2a2d2e;--in-bg:#3c3c3c;--in-bd:#6b6b6b;--accent:#4fc1ff;
  --focus:#007fd4;--btn:#0e639c;--btn-h:#1177bb;--btn2:#3a3d41;--btn2-h:#45494e;
  --txt:#cccccc;--txt2:#9d9d9d;--ph:#8b8b8b;--bd:#454545;--err:#f48771;--warn:#cca700;--ok:#4caf50;--sel:#264f78;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:16px}
.mono{font-family:'Consolas','Courier New',ui-monospace,monospace}
.wrap{max-width:650px;margin:0 auto}
.title{font-size:18px;font-weight:600;color:var(--accent);margin-bottom:14px}
.info{padding:12px;background:var(--quote);border-left:4px solid var(--accent);border-radius:4px;font-size:13px;line-height:1.5;margin-bottom:16px}
.section{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:14px}
.sh{font-size:13px;font-weight:600;color:var(--accent);padding-left:9px;border-left:3px solid var(--accent);margin-bottom:12px}
/* result */
.result{background:linear-gradient(135deg,var(--quote),var(--sel));border:2px solid var(--accent);border-radius:8px;padding:18px;margin-bottom:14px}
.r-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0}
.r-label{font-size:12px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;min-width:60px;text-align:right}
.r-val{font-size:24px;font-weight:700}
.r-val.dec{font-size:15px;font-weight:500;color:var(--txt)}
.ok{color:var(--accent)}.empty{color:var(--ph)}.err{color:var(--err)}
.copy{background:var(--btn2);color:var(--txt);border:1px solid var(--bd);border-radius:4px;font-size:12px;padding:3px 9px;cursor:pointer;min-height:26px}
.copy:hover{background:var(--btn2-h)}
.copy:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.copy.done{color:var(--ok);border-color:var(--ok)}
.r-hint{font-size:12px;text-align:center;min-height:16px;margin-top:6px;color:var(--err)}
.r-hint.warn{color:var(--warn)}
/* bit bar */
.bitbar{display:flex;height:46px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-top:12px}
.seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11px;border-right:1px solid rgba(255,255,255,.35);transition:filter .15s,outline .15s;outline:0 solid transparent}
.seg:last-child{border-right:none}
.seg b{font-weight:700}.seg small{font-size:9px;opacity:.9}
.seg.hot{filter:brightness(1.3);outline:2px solid #fff;outline-offset:-2px}
/* fields */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:span 2}
label,.lbl{font-size:13px;display:flex;align-items:center;gap:6px}
.bits{font-size:11px;color:var(--txt2);background:var(--quote);padding:1px 5px;border-radius:3px}
select,.hexwrap input,.dec input{font-size:14px;color:var(--txt);background:var(--in-bg);border:1px solid var(--in-bd);border-radius:4px}
select{padding:7px 8px;min-height:34px;width:100%}
select:focus-visible,.dec input:focus-visible{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
.hexwrap{display:flex;align-items:center;background:var(--in-bg);border:1px solid var(--in-bd);border-radius:4px}
.hexwrap:focus-within{border-color:var(--focus);outline:1px solid var(--focus)}
.hexwrap .px{padding:7px 8px;color:var(--txt2);border-right:1px solid var(--in-bd)}
.hexwrap input{flex:1;border:none;background:transparent;text-transform:uppercase;padding:7px 10px;outline:none}
.hexwrap input::placeholder{text-transform:none;color:var(--ph)}
.hexwrap.invalid{border-color:var(--err)}.hexwrap.invalid input{color:var(--err)}
.seg2{display:flex;border:1px solid var(--in-bd);border-radius:4px;overflow:hidden}
.seg2 button{flex:1;background:var(--in-bg);color:var(--txt2);border:none;border-right:1px solid var(--in-bd);padding:7px 4px;font-size:13px;cursor:pointer;min-height:34px}
.seg2 button:last-child{border-right:none}
.seg2 button[aria-pressed="true"]{background:var(--btn);color:#fff}
.seg2 button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ferr{font-size:12px;color:var(--err);min-height:15px;display:flex;align-items:center;gap:4px}
.fnote{font-size:12px;color:var(--txt2);min-height:15px}
.fnote.reserved,.fnote.undefined{color:var(--warn)}
.dec{display:flex;gap:8px}.dec input{flex:1;padding:8px 12px}
.btn{padding:9px 18px;font-size:13px;border:none;border-radius:4px;cursor:pointer;min-height:36px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn-2{background:var(--btn2);color:var(--txt)}.btn-2:hover{background:var(--btn2-h)}
.btn-1{background:var(--btn);color:#fff}.btn-1:hover{background:var(--btn-h)}
.btn-1:disabled{background:#2d2d2d;color:#6b6b6b;cursor:not-allowed}
.row{display:flex;gap:12px;margin-top:6px}
.toast{margin-top:12px;padding:10px 14px;border-radius:4px;font-size:13px;display:none}
.toast.show{display:block}
.toast.success{background:#1e3a1e;border-left:3px solid var(--ok);color:#81c784}
.toast.error{background:#3a1e1e;border-left:3px solid var(--err);color:var(--err)}
@media(max-width:380px){.grid{grid-template-columns:1fr}.f.wide{grid-column:span 1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">SMC 偏移量计算器</div>
  <div class="info"><strong>命令字格式：</strong>功能码(6) | 命令码(16) | 读取方式(1) | 读写方向(1) | 参数(8) = 32 位</div>

  <div class="result" role="group" aria-label="实时计算结果">
    <div class="r-row"><span class="r-label">16 进制</span>
      <span class="r-val ok mono" id="hex" aria-live="polite">0x00000000</span>
      <button class="copy" id="copyHex" type="button" aria-label="复制十六进制结果">复制</button></div>
    <div class="r-row"><span class="r-label">10 进制</span>
      <span class="r-val dec mono" id="dec" aria-live="polite">0</span>
      <button class="copy" id="copyDec" type="button" aria-label="复制十进制结果">复制</button></div>
    <div class="bitbar" id="bitbar" aria-hidden="true"></div>
    <div class="r-hint" id="hint" role="status" aria-live="polite"></div>
  </div>

  <div class="section">
    <div class="sh">组成字段</div>
    <div class="grid">
      <div class="f wide">
        <label for="function">功能码 (Function) <span class="bits">6-bit</span></label>
        <select id="function"></select>
        <div class="fnote" id="function-note"></div>
      </div>
      <div class="f wide">
        <label for="command">命令码 (Command) <span class="bits">16-bit</span></label>
        <div class="hexwrap" id="command-wrap"><span class="px mono">0x</span>
          <input class="mono" id="command" maxlength="4" placeholder="0000" autocomplete="off"></div>
        <div class="ferr" id="command-err"></div>
      </div>
      <div class="f">
        <span class="lbl" id="ms-label">读取方式 (MS) <span class="bits">1-bit</span></span>
        <div class="seg2" role="group" aria-labelledby="ms-label" id="ms">
          <button type="button" data-v="0" aria-pressed="true">多读</button>
          <button type="button" data-v="1" aria-pressed="false">单读</button></div>
      </div>
      <div class="f">
        <span class="lbl" id="rw-label">读写方向 (RW) <span class="bits">1-bit</span></span>
        <div class="seg2" role="group" aria-labelledby="rw-label" id="rw">
          <button type="button" data-v="0" aria-pressed="true">写操作</button>
          <button type="button" data-v="1" aria-pressed="false">读操作</button></div>
      </div>
      <div class="f wide">
        <label for="parameter">参数 (Parameter) <span class="bits">8-bit</span></label>
        <div class="hexwrap" id="parameter-wrap"><span class="px mono">0x</span>
          <input class="mono" id="parameter" maxlength="2" placeholder="00" autocomplete="off"></div>
        <div class="ferr" id="parameter-err"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sh">从偏移量反解</div>
    <div class="dec">
      <input class="mono" id="offset" placeholder="如 809893888 或 0x30460000" autocomplete="off" aria-label="十进制或十六进制偏移量">
      <button class="btn btn-2" id="parse" type="button">↓ 解析到字段</button></div>
    <div class="ferr" id="offset-err"></div>
  </div>

  <div class="row">
    <button class="btn btn-1" id="apply" type="button">✓ 应用</button>
    <button class="btn btn-2" id="cancel" type="button">✕ 取消</button></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
const FIELD_DEFS={
  function:{bits:6,shift:26,max:0x3f,len:2,label:'功能码'},
  command:{bits:16,shift:10,max:0xffff,len:4,label:'命令码'},
  ms:{bits:1,shift:9,max:1,len:1,label:'MS'},
  rw:{bits:1,shift:8,max:1,len:1,label:'RW'},
  parameter:{bits:8,shift:0,max:0xff,len:2,label:'参数'}};
const ORDER=['function','command','ms','rw','parameter'];
const COLORS={function:'#0071e3',command:'#5e5ce6',ms:'#1a7f42',rw:'#b06000',parameter:'#86868b'};
const FN_LABELS={0:'公共功能',1:'扩展组件管理功能',2:'机箱部件管理功能',3:'计算部件管理功能',4:'内存部件管理功能',5:'存储部件管理功能',6:'散热部件管理功能',7:'IO 扩展部件管理功能',8:'加速扩展部件管理功能',9:'供电部件管理功能',0x20:'Reserved（保留）'};
const MAX_U32=0xffffffff;
let fields={function:0,command:0,ms:0,rw:0,parameter:0},timer=null;
const $=id=>document.getElementById(id);

function parseHex(v){v=String(v??'').trim();if(!v)return NaN;return /^[0-9a-fA-F]+$/.test(v)?parseInt(v,16):NaN;}
function toHex(v,d){return ((v>>>0).toString(16).toUpperCase()).padStart(d,'0');}
function valid(f,v){const d=FIELD_DEFS[f];return Number.isInteger(v)&&v>=0&&v<=d.max;}
function allValid(){return ORDER.every(f=>valid(f,fields[f]));}
function encode(){let a=0;for(const f of ORDER)a|=(fields[f]<<FIELD_DEFS[f].shift);return a>>>0;}
function decode(v){v=v>>>0;const o={};for(const f of ORDER){const{shift,bits}=FIELD_DEFS[f];o[f]=(v>>>shift)&((1<<bits)-1);}return o;}
function fmtHex(v){return '0x'+(v>>>0).toString(16).toUpperCase().padStart(8,'0');}
function describeFn(c){
  if(c in FN_LABELS)return{kind:c===0x20?'reserved':'defined',label:FN_LABELS[c]};
  if(c>=0x37&&c<=0x3f)return{kind:'oem',label:'OEM 功能 (0x'+c.toString(16).toUpperCase()+')'};
  if(c>=0&&c<=0x3f)return{kind:'undefined',label:'未定义功能码'};
  return{kind:'invalid',label:'超出范围'};}

// 功能码下拉
$('function').innerHTML=Object.keys(FN_LABELS).map(v=>`<option value="${v}">0x${(+v).toString(16).toUpperCase().padStart(2,'0')} · ${FN_LABELS[v]}</option>`).join('')
  +'<optgroup label="OEM 0x37–0x3F"><option value="55">0x37 · OEM</option><option value="63">0x3F · OEM</option></optgroup>';
$('function').addEventListener('change',()=>{fields.function=+$('function').value;syncNote();update();});

['command','parameter'].forEach(f=>{
  const input=$(f),d=FIELD_DEFS[f];
  input.addEventListener('input',()=>{
    let v=input.value.toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,d.len);input.value=v;
    const n=parseHex(v);fields[f]=Number.isNaN(n)?NaN:n;vField(f);clearTimeout(timer);timer=setTimeout(update,250);});
  input.addEventListener('focus',()=>hot(f,true));
  input.addEventListener('blur',()=>{hot(f,false);vField(f,true);});
});
['ms','rw'].forEach(f=>{$(f).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  fields[f]=+b.dataset.v;$(f).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update();});});

$('parse').addEventListener('click',doParse);
$('offset').addEventListener('keydown',e=>{if(e.key==='Enter')doParse();});
$('apply').addEventListener('click',doApply);
$('cancel').addEventListener('click',reset);
$('copyHex').addEventListener('click',e=>copy(e.target,fmtHex(encode())));
$('copyDec').addEventListener('click',e=>copy(e.target,String(encode()>>>0)));

function vField(f,onBlur){const wrap=$(f+'-wrap'),err=$(f+'-err');if(!wrap)return;
  const ok=valid(f,fields[f]),show=onBlur||!Number.isNaN(fields[f]);
  wrap.classList.toggle('invalid',!ok&&show);err.textContent=(!ok&&show)?'⚠ 超出范围（'+FIELD_DEFS[f].label+' ≤ 0x'+FIELD_DEFS[f].max.toString(16).toUpperCase()+'）':'';}
function syncNote(){const n=$('function-note'),d=describeFn(fields.function);n.textContent=d.label;n.className='fnote '+d.kind;}
function hot(f,on){const s=document.querySelector('.seg[data-f="'+f+'"]');if(s)s.classList.toggle('hot',on);}
function renderBar(){$('bitbar').innerHTML=ORDER.map(f=>{const d=FIELD_DEFS[f];
  return `<div class="seg" data-f="${f}" style="flex:${d.bits};background:${COLORS[f]}"><b>${d.label}</b>${d.bits>1?'<small>'+d.bits+'b</small>':''}</div>`;}).join('');}
function writeFields(){$('function').value=String(fields.function);syncNote();
  $('command').value=toHex(fields.command||0,FIELD_DEFS.command.len);
  $('parameter').value=toHex(fields.parameter||0,FIELD_DEFS.parameter.len);
  ['ms','rw'].forEach(f=>$(f).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===fields[f]))));}

function update(){
  const hexEl=$('hex'),decEl=$('dec'),hint=$('hint'),apply=$('apply');
  const missing=ORDER.some(f=>Number.isNaN(fields[f])),ok=allValid();
  hexEl.className='r-val mono '+(missing?'empty':ok?'ok':'err');
  if(missing){hexEl.textContent='0x--------';decEl.textContent='—';hint.className='r-hint';hint.textContent='请补全所有字段';apply.disabled=true;}
  else if(!ok){const bad=ORDER.filter(f=>!valid(f,fields[f])).map(f=>FIELD_DEFS[f].label);
    hexEl.textContent='0x--------';decEl.textContent='—';hint.className='r-hint';hint.textContent='⚠ 字段超出范围：'+bad.join('、');apply.disabled=true;}
  else{const off=encode();hexEl.textContent=fmtHex(off);decEl.textContent=String(off>>>0);hint.className='r-hint';hint.textContent='';apply.disabled=false;}
}
function doParse(){const raw=$('offset').value.trim(),err=$('offset-err'),hint=$('hint');
  if(!raw){err.textContent='⚠ 请输入偏移量';return;}
  const v=/^0x/i.test(raw)?parseInt(raw,16):parseInt(raw,10);
  if(Number.isNaN(v)||v<0){err.textContent='⚠ 无效的偏移量';return;}
  err.textContent='';fields=decode(v>>>0);writeFields();['command','parameter'].forEach(f=>vField(f));update();
  if(v>MAX_U32){hint.className='r-hint warn';hint.textContent='⚠ 输入超过 32 位，已取低 32 位 ('+(v>>>0)+')';}}
function doApply(){if(!allValid()){toast('error','存在无效字段，请检查输入');return;}
  const off=encode(),detail={offsetHex:fmtHex(off),offsetDec:off>>>0,fields:{...fields}};
  document.dispatchEvent(new CustomEvent('smc-apply',{detail}));
  console.log('[smc-apply]',detail);toast('success','已应用：'+detail.offsetHex+' ('+detail.offsetDec+')');}
function reset(){fields={function:0,command:0,ms:0,rw:0,parameter:0};writeFields();$('offset').value='';
  ['command','parameter'].forEach(f=>{$(f+'-wrap').classList.remove('invalid');$(f+'-err').textContent='';});
  $('offset-err').textContent='';$('toast').className='toast';update();}
async function copy(btn,text){try{await navigator.clipboard.writeText(text);}catch(e){}
  const old=btn.textContent;btn.textContent='已复制 ✓';btn.classList.add('done');
  setTimeout(()=>{btn.textContent=old;btn.classList.remove('done');},800);}
function toast(kind,msg){const t=$('toast');t.className='toast show '+kind;t.textContent=msg;}

renderBar();writeFields();update();
</script>
</body>
</html>
