<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管道表达式批量评估器 · PTO Design System</title>

<!-- ── PTO Design System tokens (foundation → semantic → components) ─────────── -->
<link rel="stylesheet" href="design-system/foundation.css">
<link rel="stylesheet" href="design-system/semantic.css">
<link rel="stylesheet" href="design-system/components.css">

<style>
/* ════════════════════════════════════════════════════════════════════════════
   App styles — 全部基于 PTO Design System 语义 token，零硬编码颜色
   仅图标 SVG 的 currentColor 跟随 foreground
═══════════════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: var(--text-body);
  color: var(--foreground);
  background: var(--app-background);
  padding: var(--space-4);
  -webkit-font-smoothing: antialiased;
}
code, .mono { font: var(--text-mono); }

/* ── App shell ────────────────────────────────────────────────────────────── */
.app-shell {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* ── Top bar（替换原 56px 蓝色横幅 → 紧凑 toolbar）──────────────────────────── */
.topbar {
  height: var(--comp-toolbar-height);
  background: var(--comp-toolbar-bg);
  border: 1px solid var(--comp-toolbar-border);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-4);
}
.topbar .tb-icon { color: var(--primary); display: flex; }
.topbar .tb-title { font: var(--text-title-2); }
.topbar .tb-beta {
  font: var(--text-label);
  letter-spacing: var(--letter-spacing-label);
  color: var(--foreground-muted);
  background: var(--comp-tag-bg);
  border: 1px solid var(--comp-tag-border);
  padding: 2px var(--space-2);
  border-radius: var(--tag-radius);
  text-transform: uppercase;
}
.topbar .tb-spacer { flex: 1; }

/* Theme switcher (segmented control) */
.theme-seg {
  display: flex;
  gap: var(--segmented-control-gap);
  padding: var(--segmented-control-padding);
  background: var(--segmented-control-bg);
  border: 1px solid var(--segmented-control-border);
  border-radius: var(--segmented-control-radius);
}
.theme-seg button {
  border: none; background: transparent;
  color: var(--foreground-secondary);
  font: var(--text-label);
  padding: 3px var(--space-2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--duration-fast) var(--easing-default), color var(--duration-fast) var(--easing-default);
}
.theme-seg button:hover { color: var(--foreground); background: var(--state-hover); }
.theme-seg button.active { color: var(--primary-foreground); background: var(--primary); }

/* ── Mode toggle（segmented control）──────────────────────────────────────── */
.mode-toggle {
  display: flex;
  gap: var(--segmented-control-gap);
  padding: var(--segmented-control-padding);
  background: var(--segmented-control-bg);
  border: 1px solid var(--segmented-control-border);
  border-radius: var(--segmented-control-radius);
}
.mode-btn {
  flex: 1; border: none; background: transparent;
  color: var(--foreground-secondary);
  font: var(--text-body-sm);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--duration-fast) var(--easing-default);
}
.mode-btn:hover:not(.active) { background: var(--state-hover); color: var(--foreground); }
.mode-btn.active { background: var(--primary); color: var(--primary-foreground); }
.mode-btn svg { width: 14px; height: 14px; }

/* ── Panel / Section ──────────────────────────────────────────────────────── */
.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-radius);
  padding: var(--panel-padding);
}
.panel-title {
  font: var(--text-title-2);
  margin-bottom: var(--space-3);
  display: flex; align-items: center; gap: var(--space-2);
}
.panel-title svg { width: 15px; height: 15px; color: var(--foreground-secondary); }
.panel-title .pt-hint { font: var(--text-body-sm); color: var(--foreground-muted); font-weight: 400; margin-left: auto; }

/* ── Expression editor ────────────────────────────────────────────────────── */
.expr-textarea {
  width: 100%; min-height: 52px;
  padding: var(--space-3);
  font: var(--text-mono);
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  color: var(--foreground);
  border-radius: var(--input-radius);
  resize: vertical;
}
.expr-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
.expr-textarea.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--tone-critical-bg); }

/* inline validation 区（替换 alert）*/
.inline-msg {
  margin-top: var(--space-2);
  font: var(--text-body-sm);
  padding: 6px var(--space-3);
  border-radius: var(--radius-sm);
  display: none;
  align-items: flex-start; gap: 6px;
}
.inline-msg.show { display: flex; }
.inline-msg.err { color: var(--danger); background: var(--tone-critical-bg); }
.inline-msg.ok  { color: var(--success); background: var(--tone-green-strong); }
.inline-msg svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

.expr-actions { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-3); align-items: center; }
.kbd-hint { font: var(--text-label); color: var(--foreground-muted); margin-right: auto; display: flex; align-items: center; gap: 4px; }
kbd {
  font: var(--text-label); font-family: var(--font-mono);
  background: var(--surface-3); border: 1px solid var(--border-default);
  border-radius: var(--radius-sm); padding: 1px 5px; color: var(--foreground-secondary);
}

/* ── Buttons (PTO btn) ────────────────────────────────────────────────────── */
.btn {
  height: var(--button-height-sm);
  padding: 0 var(--button-padding-x-md);
  font: var(--button-font);
  border-radius: var(--button-radius);
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--button-gap);
  transition: background var(--duration-fast) var(--easing-default);
}
.btn svg { width: 13px; height: 13px; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--button-focus-ring); }
.btn:disabled { opacity: var(--button-disabled-opacity); cursor: not-allowed; }
.btn-solid { background: var(--button-solid-bg); color: var(--button-solid-fg); box-shadow: var(--button-solid-shadow); }
.btn-solid:hover:not(:disabled) { background: var(--button-solid-bg-hover); }
.btn-solid:active:not(:disabled) { background: var(--button-solid-bg-press); }
.btn-secondary { background: var(--button-secondary-bg); color: var(--button-secondary-fg); border-color: var(--button-secondary-border); box-shadow: var(--button-secondary-shadow); }
.btn-secondary:hover:not(:disabled) { background: var(--button-secondary-bg-hover); }
.btn-ghost { background: transparent; color: var(--button-ghost-fg); }
.btn-ghost:hover:not(:disabled) { background: var(--button-ghost-bg-hover); color: var(--button-ghost-fg-hover); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

/* ── Input parameter rows ─────────────────────────────────────────────────── */
.input-row {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) 0;
  flex-wrap: wrap;
}
.input-row.warn .input-field { border-color: var(--warning); }
.input-label { min-width: 220px; display: flex; align-items: center; gap: var(--space-2); font: var(--text-body-sm); }
.input-label .pname { font: var(--text-mono); color: var(--foreground); }
.input-label .phint { color: var(--foreground-muted); }

/* 动态徽章（替换硬编码 SYNC）*/
.badge {
  display: inline-flex; align-items: center; height: var(--tag-height);
  padding: 0 var(--tag-padding-x);
  border-radius: var(--tag-radius);
  font: var(--text-label); letter-spacing: var(--letter-spacing-label);
  text-transform: uppercase; flex-shrink: 0;
  border: 1px solid transparent;
}
.badge-sync     { background: var(--tone-info-bg);     color: var(--primary);  border-color: color-mix(in srgb, var(--primary) 40%, transparent); }
.badge-ref      { background: color-mix(in srgb, var(--highlight-l0a-violet-source) 16%, transparent); color: var(--highlight-l0a-violet-source); border-color: color-mix(in srgb, var(--highlight-l0a-violet-source) 40%, transparent); }
.badge-const    { background: var(--tone-green-strong); color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, transparent); }
.badge-literal  { background: var(--state-muted);      color: var(--foreground-secondary); border-color: var(--border-default); }
.badge-template { background: var(--tone-warning-bg);  color: var(--warning);  border-color: color-mix(in srgb, var(--warning) 40%, transparent); }

.badge-select {
  appearance: none;
  background: transparent; border: 1px solid var(--border-default);
  color: var(--foreground-secondary); font: var(--text-label);
  border-radius: var(--radius-sm); padding: 2px 4px; cursor: pointer;
}
.badge-select:focus { outline: none; border-color: var(--primary); }

.input-field {
  flex: 1; min-width: 200px;
  height: var(--input-height-md);
  padding: 0 var(--space-3);
  font: var(--text-mono);
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  color: var(--foreground);
  border-radius: var(--input-radius);
}
.input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
.param-msg { flex-basis: 100%; font: var(--text-label); color: var(--warning); padding-left: 232px; display: none; }
.param-msg.show { display: block; }

/* ── Pipeline stages ──────────────────────────────────────────────────────── */
.stage {
  padding: var(--space-3);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--primary);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-2);
}
.stage:last-child { margin-bottom: 0; }
.stage-expr { font: var(--text-mono); color: var(--foreground-secondary); margin-bottom: 4px; word-break: break-all; }
.stage-out { font: var(--text-body); font-weight: 500; }
.stage-out.waiting { color: var(--foreground-muted); font-style: italic; font-weight: 400; }

/* ── Final result ─────────────────────────────────────────────────────────── */
.final-result {
  padding: var(--space-4);
  background: var(--surface-2);
  border: 1px solid var(--primary);
  border-radius: var(--radius-md);
  font: var(--text-title-1); text-align: center;
  word-break: break-all;
}
.final-result.waiting { color: var(--foreground-muted); font: var(--text-body); font-style: italic; }
.final-result.error { border-color: var(--danger); color: var(--danger); font: var(--text-body); }
.result-actions { text-align: center; margin-top: var(--space-3); }

/* ── Template variable panel（新增 — 打开隐藏功能）─────────────────────────── */
.tpl-panel .tpl-head {
  display: flex; align-items: center; gap: var(--space-2); cursor: pointer; user-select: none;
}
.tpl-head .caret { transition: transform var(--duration-fast) var(--easing-default); color: var(--foreground-muted); display: flex; }
.tpl-panel.open .tpl-head .caret { transform: rotate(90deg); }
.tpl-body { display: none; margin-top: var(--space-3); flex-direction: column; gap: var(--space-2); }
.tpl-panel.open .tpl-body { display: flex; }
.tpl-row { display: flex; align-items: center; gap: var(--space-2); }
.tpl-row .tpl-key, .tpl-row .tpl-val {
  height: var(--input-height-md); padding: 0 var(--space-3);
  font: var(--text-mono); background: var(--input-bg);
  border: 1px solid var(--input-border); color: var(--foreground);
  border-radius: var(--input-radius);
}
.tpl-row .tpl-key { width: 200px; }
.tpl-row .tpl-val { flex: 1; }
.tpl-row .tpl-key:focus, .tpl-row .tpl-val:focus { outline: none; border-color: var(--primary); }
.icon-btn {
  width: 28px; height: 28px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--border-default);
  border-radius: var(--radius-sm); color: var(--foreground-muted); cursor: pointer;
}
.icon-btn:hover { background: var(--state-hover); color: var(--foreground); }
.icon-btn svg { width: 13px; height: 13px; }

/* ── History panel（新增 P1 — localStorage 持久化）────────────────────────── */
.history-list { display: flex; flex-direction: column; gap: var(--space-2); }
.history-empty { font: var(--text-body-sm); color: var(--foreground-muted); }
.history-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--inspector-soft-card-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--inspector-soft-card-radius);
  cursor: pointer;
}
.history-item:hover { background: var(--inspector-soft-card-bg-hover); border-color: var(--border-default); }
.history-item .hi-expr { font: var(--text-mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--foreground-secondary); }
.history-item .hi-time { font: var(--text-label); color: var(--foreground-muted); flex-shrink: 0; }

/* ── Test-case loading ────────────────────────────────────────────────────── */
.load-textarea {
  width: 100%; min-height: 130px;
  padding: var(--space-3);
  font: var(--text-mono);
  background: var(--input-bg); border: 1px solid var(--input-border);
  color: var(--foreground); border-radius: var(--input-radius); resize: vertical;
}
.load-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
.load-textarea::placeholder { color: var(--foreground-disabled); }
.action-bar { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }

/* ── Stats ────────────────────────────────────────────────────────────────── */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: var(--space-2); margin-bottom: var(--space-3);
}
.stat {
  text-align: center; padding: var(--space-3) var(--space-2);
  background: var(--surface-2); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
}
.stat-v { font: var(--text-title-1); }
.stat-v.s-ok { color: var(--success); }
.stat-v.s-fail { color: var(--danger); }
.stat-v.s-warn { color: var(--warning); }
.stat-l { font: var(--text-label); color: var(--foreground-muted); text-transform: uppercase; letter-spacing: var(--letter-spacing-label); margin-top: 2px; }

/* ── Filter chips（新增 P1 — 结果筛选）────────────────────────────────────── */
.filter-bar { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.filter-chip {
  height: var(--stat-chip-height); padding: 0 var(--stat-chip-padding-x);
  background: var(--stat-chip-bg); border: 1px solid var(--stat-chip-border);
  border-radius: var(--stat-chip-radius); color: var(--foreground-secondary);
  font: var(--text-label); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}
.filter-chip.active { background: var(--state-selected); border-color: var(--primary); color: var(--foreground); }
.filter-chip .fc-count { color: var(--foreground-muted); }

/* ── Virtual scroll table ─────────────────────────────────────────────────── */
.vtable-header {
  display: flex;
  background: color-mix(in srgb, var(--surface-2) 80%, transparent);
  border: 1px solid var(--table-border); border-radius: var(--radius-md) var(--radius-md) 0 0;
  min-width: fit-content;
  height: var(--table-header-height);
}
.vtable-header .vcell { font: var(--text-label); text-transform: uppercase; letter-spacing: var(--letter-spacing-label); color: var(--foreground-muted); display: flex; align-items: center; }
.virtual-container {
  max-height: calc(100vh - 420px); min-height: 160px;
  overflow: auto; position: relative;
  border: 1px solid var(--table-border); border-top: none;
}
.virtual-spacer { position: relative; }
.virtual-content { position: absolute; top: 0; left: 0; right: 0; }
.vrow {
  display: flex; min-width: fit-content;
  height: var(--table-row-height); align-items: center;
  border-bottom: 1px solid var(--border-subtle);
}
.vrow:hover { background: var(--state-hover); }
.vrow.mismatch { background: var(--tone-critical-bg); }
.vrow.errored { background: var(--tone-warning-bg); }
.vcell { padding: 0 var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--text-mono); }
.vcell.ci { width: 52px; flex-shrink: 0; justify-content: center; color: var(--foreground-muted); }
.vcell.inp, .vcell.exp, .vcell.act { flex: 1; min-width: 120px; display: block; }
.vcell.st { width: 64px; flex-shrink: 0; display: flex; justify-content: center; }
.mic { width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700; }
.mic-ok { background: var(--success); color: var(--background); }
.mic-fail { background: var(--danger); color: var(--primary-foreground); }
.mic-err { background: var(--warning); color: var(--background); }
.scroll-foot {
  display: flex; justify-content: space-between;
  font: var(--text-label); color: var(--foreground-muted);
  padding: var(--space-2) var(--space-3);
  background: color-mix(in srgb, var(--surface-2) 80%, transparent);
  border: 1px solid var(--table-border); border-top: none;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
}

/* ── Error box / toast ────────────────────────────────────────────────────── */
.errbox {
  padding: var(--space-3);
  background: var(--tone-critical-bg);
  border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  border-radius: var(--radius-md);
  font: var(--text-body-sm); color: var(--foreground);
  display: none;
}
.errbox.show { display: block; }
.errbox strong { color: var(--danger); }
.errbox .err-detail { margin-top: 4px; color: var(--foreground-secondary); white-space: pre-wrap; }

#toast {
  position: fixed; bottom: var(--space-5); right: var(--space-5);
  background: var(--surface-4); color: var(--foreground);
  border: 1px solid var(--border-strong);
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
  font: var(--text-body-sm); box-shadow: var(--shadow-md);
  z-index: var(--z-toast); opacity: 0; transform: translateY(8px);
  transition: opacity var(--duration-base) var(--easing-default), transform var(--duration-base) var(--easing-default);
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }

.hidden { display: none !important; }
.muted-note { font: var(--text-body-sm); color: var(--foreground-muted); }
</style>
</head>
<body>
<div class="app-shell">

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <div class="topbar">
    <span class="tb-icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" width="18" height="18">
        <path d="M2 4h12M2 8h8M2 12h5"/><circle cx="13" cy="11" r="2"/>
      </svg>
    </span>
    <span class="tb-title">管道表达式批量评估器</span>
    <span class="tb-beta">Beta</span>
    <span class="tb-spacer"></span>
    <div class="theme-seg" role="group" aria-label="主题切换">
      <button data-theme-val="dark" class="active" onclick="setTheme('dark')">暗色</button>
      <button data-theme-val="light" onclick="setTheme('light')">亮色</button>
      <button data-theme-val="glass" onclick="setTheme('glass')">玻璃</button>
    </div>
  </div>

  <!-- ── Expression editor ────────────────────────────────────────────────── -->
  <div class="panel">
    <div class="panel-title">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 2v12M12 2v12M2 5h2M2 11h2M12 5h2M12 11h2"/></svg>
      表达式
    </div>
    <textarea id="expr-input" class="expr-textarea" spellcheck="false">$1;$2 |> expr($1 + $2) |> expr($1 * 2)</textarea>
    <div id="expr-msg" class="inline-msg"></div>
    <div class="expr-actions">
      <span class="kbd-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 应用</span>
      <button class="btn btn-secondary" onclick="resetExpr()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"/></svg>
        重置
      </button>
      <button class="btn btn-primary" onclick="applyExpr()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5l3 3 7-7"/></svg>
        应用表达式
      </button>
    </div>
  </div>

  <!-- ── Mode toggle ──────────────────────────────────────────────────────── -->
  <div class="mode-toggle" role="tablist">
    <button class="mode-btn active" id="btn-debug" role="tab" onclick="switchMode('debug')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="9" r="4"/><path d="M8 5V2M5 3l1.5 2M11 3L9.5 5M2 9h2M12 9h2M4 13l1.5-1.5M12 13l-1.5-1.5"/></svg>
      调试模式
    </button>
    <button class="mode-btn" id="btn-testcase" role="tab" onclick="switchMode('testcase')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M5 6h6M5 9h6M5 12h3"/></svg>
      用例模式
    </button>
  </div>

  <!-- ── Debug mode ───────────────────────────────────────────────────────── -->
  <div id="dbg-inputs" class="panel">
    <div class="panel-title">

<!-- ═══════════════════════════════════════════════════════════════════════════
     JavaScript — 求值核心逐字移植自原 Demo（逻辑零改动），仅 UI/UX 层增强

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   1.  SafeExpressionParser  (逐字移植，未改动求值逻辑)
═══════════════════════════════════════════════════════════════════════════ */
class SafeExpressionParser {
  constructor(input) { this.input = input; this.tokens = []; this.pos = 0; this._tokenize(); }
  _tokenize() {

      { re: /\s+/, skip: true },

      { re: /\/\/.*$/, skip: true },
      { re: /\d+(\.\d+)?/ },
      { re: /"[^"]*"|'[^']*'/ },
      { re: /true|false/ },
      { re: /null|undefined/ },
      { re: /\?/, sub: 'and' },
      { re: /:(?![a-zA-Z_$])/, sub: 'or' },
      { re: /\band\b/ }, { re: /\bor\b/ },
      { re: /&&/ }, { re: /\|\|/ },
      { re: />>>|<<|>>/ },
      { re: /~=|==|!=|<=|>=/ },
      { re: /[+\-*/%&|^~!<>]/ },

  _luaAnd(l, r) { return this._truthy(l) ? r : l; }
  _luaOr(l, r) { return this._truthy(l) ? l : r; }
  _parseLogicalOr() {

  }
  _parseLogicalAnd() {

    while (true) { const op = this._peek(); if (op === '&&' || op === 'and') { this._consume(); l = this._luaAnd(l, this._parseRelational()); } else break; }
    return l;
  }
  _parseRelational() {
    let l = this._parseBitwiseOr();
    while (true) {
      if (this._match('==')) l = l === this._parseBitwiseOr();
      else if (this._match('!=')) l = l !== this._parseBitwiseOr();
      else if (this._match('~=')) l = l !== this._parseBitwiseOr();
      else if (this._match('<=')) l = l <= this._parseBitwiseOr();
      else if (this._match('>=')) l = l >= this._parseBitwiseOr();
      else if (this._peek() === '<' && this._peek(1) !== '<') { this._consume(); l = l < this._parseBitwiseOr(); }
      else if (this._peek() === '>' && this._peek(1) !== '>') { this._consume(); l = l > this._parseBitwiseOr(); }
      else break;
    }
    return l;
  }
  _parseBitwiseOr() { let l = this._parseBitwiseXor(); while (this._peek() === '|' && this._peek(1) !== '|') { this._consume(); l = l | this._parseBitwiseXor(); } return l; }
  _parseBitwiseXor() { let l = this._parseBitwiseAnd(); while (this._peek() === '^') { this._consume(); l = l ^ this._parseBitwiseAnd(); } return l; }
  _parseBitwiseAnd() { let l = this._parseShift(); while (this._peek() === '&' && this._peek(1) !== '&') { this._consume(); l = l & this._parseShift(); } return l; }
  _parseShift() {
    let l = this._parseAdditive();
    while (true) {
      if (this._match('<<<')) l = l << this._parseAdditive();
      else if (this._match('>>>')) l = (l >>> 0) >>> this._parseAdditive();
      else if (this._match('<<')) l = l << this._parseAdditive();
      else if (this._match('>>')) l = l >> this._parseAdditive();
      else break;
    }
    return l;
  }
  _parseAdditive() {
    let l = this._parseMultiplicative();
    while (true) {
      if (this._peek() === '+' && this.pos > 0) { this._consume(); l = l + this._parseMultiplicative(); }
      else if (this._peek() === '-' && this.pos > 0) { this._consume(); l = l - this._parseMultiplicative(); }

    }

  }
  _parseMultiplicative() {
    let l = this._parseUnary();

      else if (this._peek() === '/') { this._consume(); l = l / this._parseUnary(); }
      else if (this._peek() === '%') { this._consume(); l = l % this._parseUnary(); }

    }
    return l;
  }
  _parseUnary() {
    if (this._match('!')) return !this._parseUnary();
    if (this._match('~')) return ~this._parseUnary();
    if (this._match('-')) return -this._parseUnary();
    if (this._match('+')) return +this._parseUnary();
    return this._parsePrimary();
  }
  _parsePrimary() {
    if (this._match('(')) { const v = this._parseLogicalOr(); this._expect(')'); return v; }
    const t = this._peek();
    if (t === null) throw new Error('意外的表达式结束');
    if (t === '__EMPTY_STRING__') { this._consume(); return ''; }
    if (t === '__NULL__') { this._consume(); return null; }
    if (t === '__UNDEFINED__') { this._consume(); return undefined; }
    if (t.startsWith('"') || t.startsWith("'")) { this._consume(); return t.slice(1, -1); }
    if (/^-?\d+(\.\d+)?$/.test(t)) { this._consume(); return parseFloat(t); }
    if (t === 'true') { this._consume(); return true; }
    if (t === 'false') { this._consume(); return false; }
    if (t === 'null') { this._consume(); return null; }
    if (t === 'undefined') { this._consume(); return undefined; }
    this._consume();
    if (t === 'NaN') return NaN;
    if (t === 'Infinity') return Infinity;
    const n = parseFloat(t);
    return isNaN(n) ? t : n;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   2.  PipeEvaluator  (逐字移植)
═══════════════════════════════════════════════════════════════════════════ */
class PipeEvaluator {
  constructor() { this.templateVars = new Map(); }
  _parseVal(v) {
    if (typeof v !== 'string') return v;
    if (/^-?\d+(\.\d+)?$/.test(v)) { const n = parseFloat(v); if (!isNaN(n)) return n; }
    if (v.toLowerCase() === 'true') return true;
    if (v.toLowerCase() === 'false') return false;
    if (v.toLowerCase() === 'null') return null;
    return v;
  }
  _rmQuotes(s) {
    s = String(s);
    if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1);
    return s;
  }
  _replTplVars(s) {
    return s.replace(/\$\{([^}]+)\}/g, (m, name) => { const v = this.templateVars.get(name); return v !== undefined ? String(v) : m; });
  }
  _replParams(arg, params) {
    let r = arg;
    for (let i = 0; i < params.length; i++) {
      let pv = params[i];
      if (typeof pv === 'string' && ((pv.startsWith('"') && pv.endsWith('"')) || (pv.startsWith("'") && pv.endsWith("'")))) pv = pv.slice(1, -1);
      const sub = pv === '' ? '__EMPTY_STRING__' : pv === null ? '__NULL__' : pv === undefined ? '__UNDEFINED__' : String(pv);
      r = r.replace(new RegExp('\\$' + (i + 1), 'g'), sub);
    }
    return this._replTplVars(r);
  }
  _strFormat(fmt, params) {
    let pi = 0;
    return fmt.replace(/%(-)?(\+)?( )?(0)?(\d+)?(?:\.(\d+))?([sdfoxXeEubBgGi])/g, (_, la, ps, sp, zp, wS, prS, type) => {
      if (pi >= params.length) return _;
      const raw = params[pi++];
      const width = wS ? parseInt(wS) : 0;
      const prec = prS !== undefined ? parseInt(prS) : (['f','e','E','g','G'].includes(type) ? 6 : 0);
      const num = Number(raw);
      let fmt2 = '';
      switch (type) {
        case 's': fmt2 = String(raw ?? ''); if (prec > 0) fmt2 = fmt2.slice(0, prec); break;
        case 'd': case 'i': fmt2 = Math.trunc(num).toString(); break;
        case 'f': fmt2 = num.toFixed(prec); break;
        case 'e': fmt2 = num.toExponential(prec); break;
        case 'E': fmt2 = num.toExponential(prec).replace('e','E'); break;
        case 'g': case 'G':
          fmt2 = (Math.abs(num) >= 1e-4 && Math.abs(num) < 1e4) ? num.toFixed(prec) : num.toExponential(prec);
          if (type === 'G') fmt2 = fmt2.replace('e','E'); break;
        case 'x': fmt2 = Math.round(num).toString(16); break;
        case 'X': fmt2 = Math.round(num).toString(16).toUpperCase(); break;
        case 'o': fmt2 = Math.round(num).toString(8); break;
        case 'b': case 'B': fmt2 = Math.round(num).toString(2); break;
        case 'u': fmt2 = Math.abs(Math.trunc(num)).toString(); break;
        default: fmt2 = String(raw ?? '');
      }
      if (ps && !isNaN(num) && type !== 's') { if (num > 0) fmt2 = '+' + fmt2; }
      else if (sp && !isNaN(num) && !ps && type !== 's') { if (num >= 0) fmt2 = ' ' + fmt2; }
      if (fmt2.length < width) {
        const pad = width - fmt2.length;
        if (zp && !la && type !== 's') {
          if (/^[+\- ]/.test(fmt2)) fmt2 = fmt2[0] + '0'.repeat(pad) + fmt2.slice(1);
          else fmt2 = '0'.repeat(pad) + fmt2;
        } else if (la) fmt2 = fmt2 + ' '.repeat(pad);
        else fmt2 = ' '.repeat(pad) + fmt2;
      }
      return fmt2;
    });
  }
  _strSub(s, start, end) {
    const len = s.length;
    let a = start < 0 ? len + start + 1 : start;
    let b = end < 0 ? len + end + 1 : end;
    const js = Math.max(0, a - 1);
    const je = Math.min(len, b);
    return js >= len || js > je ? '' : s.substring(js, je);
  }
  _luaPatToRegex(pat) {
    const magic = '^$()%.[]*+-?';
    const cls = { a:'[A-Za-z]', d:'[0-9]', s:'\\s', l:'[a-z]', u:'[A-Z]', w:'[A-Za-z0-9_]', x:'[0-9A-Fa-f]', c:'[\\x00-\\x1F]', z:'\\x00' };
    let r = ''; let i = 0;
    while (i < pat.length) {
      const c = pat[i];
      if (c === '%' && i + 1 < pat.length) { const nx = pat[++i]; r += cls[nx] || nx; i++; }
      else if (c === '[') { const cb = pat.indexOf(']', i); if (cb === -1) { r += '\\['; i++; } else { r += '[' + pat.slice(i+1, cb) + ']'; i = cb + 1; } }

  }
  _evalStage(stage, params) {
    const pArr = Array.isArray(params) ? params : [params];
    const args = stage.args.map(a => this._replParams(a, pArr));
    switch (stage.fn) {
      case 'expr': return new SafeExpressionParser(args[0]).parse();
      case 'string.format': { let fmt = args[0]; if ((fmt.startsWith('"') && fmt.endsWith('"')) || (fmt.startsWith("'") && fmt.endsWith("'"))) fmt = fmt.slice(1, -1); return this._strFormat(fmt, args.slice(1)); }
      case 'string.cmp': return this._rmQuotes(args[0]) === this._rmQuotes(args[1]);
      case 'string.sub': { const s = this._rmQuotes(args[0]); return this._strSub(s, parseInt(args[1], 10), parseInt(args[2], 10)); }
      case 'string.gsub': { const s = this._rmQuotes(args[0]); const rgx = this._luaPatToRegex(this._rmQuotes(args[1])); const rep = this._rmQuotes(args[2]).replace(/%(\d)/g, '$$$1'); return s.replace(rgx, rep); }

      case 'string.lower': return this._rmQuotes(args[0]).toLowerCase();

    }
  }
  evaluate(parsed, inputVals, tplVars) {
    this.templateVars = tplVars || new Map();
    try {
      const inputs = inputVals.map((v, i) => { if (v === '' || v === undefined) throw new Error(`参数 $${i+1} 未提供`); return this._parseVal(v); });

      let cur = inputs;
      for (const stage of parsed.stages) { cur = this._evalStage(stage, cur); intermediates.push(cur); }
      return { success: true, result: cur, intermediates };
    } catch (e) { return { success: false, error: e.message, intermediates: [] }; }
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   3.  Pipe expression parser  (逐字移植)
═══════════════════════════════════════════════════════════════════════════ */
function parsePipeExpr(raw) {
  try {
    const firstPipe = raw.indexOf(' |> ');
    let inputPart, pipeStr;
    if (firstPipe === -1) { inputPart = raw.trim(); pipeStr = ''; }
    else { inputPart = raw.slice(0, firstPipe).trim(); pipeStr = raw.slice(firstPipe + 4).trim(); }
    const inputTokens = inputPart.split(';').map(t => t.trim()).filter(Boolean);
    const inputs = inputTokens.map((t, i) => ({ idx: i, placeholder: t, desc: `参数 ${t}` }));
    const stageStrs = pipeStr ? pipeStr.split(' |> ').filter(Boolean) : [];
    const stages = stageStrs.map(s => {
      s = s.trim();
      const m = s.match(/^([A-Za-z_][A-Za-z0-9_.]*)\((.*)\)$/s);
      if (!m) return { fn: 'expr', args: [s], raw: s };
      const fn = m[1]; const argsStr = m[2];
      const args = splitArgs(argsStr);
      return { fn, args, raw: s };
    });
    return { ok: true, inputs, stages };
  } catch (e) { return { ok: false, error: e.message }; }
}
function splitArgs(s) {
  const args = []; let cur = ''; let depth = 0; let inQ = false; let qc = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (!inQ && (c === '"' || c === "'")) { inQ = true; qc = c; cur += c; continue; }
    if (inQ && c === qc && s[i-1] !== '\\') { inQ = false; qc = ''; cur += c; continue; }
    if (inQ) { cur += c; continue; }
    if (c === '(') { depth++; cur += c; continue; }
    if (c === ')') { depth--; cur += c; continue; }
    if (c === ',' && depth === 0) { args.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) args.push(cur.trim());
  return args;
}

/* ═══════════════════════════════════════════════════════════════════════════
   4.  Test case parser  (逐字移植)
═══════════════════════════════════════════════════════════════════════════ */
function parseTestCaseLine(line, lineNum) {
  const tokens = tokenizeLine(line, lineNum);
  if (tokens.length < 2) throw new Error(`至少需要 2 列（输入 + 预期输出），得到 ${tokens.length} 列`);
  const inputs = tokens.slice(0, -1).map(t => { const n = Number(t); return (isNaN(n) || t === '') ? t : n; });
  return { id: Math.random().toString(36).slice(2), inputs, expectedOutput: tokens[tokens.length - 1], actualOutput: null, executionStatus: 'pending', lineNumber: lineNum, createdAt: Date.now() };
}
function tokenizeLine(line, lineNum) {
  const tokens = []; let cur = ''; let inQ = false; let qc = ''; let i = 0;
  while (i < line.length) {
    const c = line[i];
    if (!inQ && (c === '"' || c === "'")) { inQ = true; qc = c; i++; continue; }
    if (inQ && c === qc) { if (i + 1 < line.length && line[i+1] === qc) { cur += qc; i += 2; continue; } inQ = false; qc = ''; i++; continue; }
    if (inQ && c === '\\' && i + 1 < line.length) { const nx = line[i+1]; const esc = { n:'\n', t:'\t', r:'\r', '\\':'\\', '"':'"', "'":"'", '0':'\0' }; cur += esc[nx] ?? nx; i += 2; continue; }
    if (!inQ && (c === ' ' || c === ',' || c === '\t')) { if (cur.trim()) tokens.push(cur.trim()); cur = ''; i++; continue; }
    cur += c; i++;
  }
  if (cur.trim()) tokens.push(cur.trim());
  if (inQ) throw new Error(`第 ${lineNum} 行引号未闭合`);
  return tokens;
}
function parseTestCaseText(text) {
  const lines = text.split('\n'); const cases = [], errors = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim() || line.trim().startsWith('#')) continue;
    try { cases.push(parseTestCaseLine(line, i + 1)); } catch (e) { errors.push({ line: i + 1, message: e.message, context: line }); }
  }
  return { cases, errors };
}

/* ═══════════════════════════════════════════════════════════════════════════
   5.  Application state
═══════════════════════════════════════════════════════════════════════════ */
const evaluator = new PipeEvaluator();
const DEFAULT_EXPR = '$1;$2 |> expr($1 + $2) |> expr($1 * 2)';
let originalExprText = DEFAULT_EXPR;
let parsedExpr = parsePipeExpr(originalExprText);
let inputValues = [];
let badgeTypes = [];          // 每个参数的徽章类型（P1：动态徽章）
let templateVars = [];        // {key, val}（P0：模板变量面板）
let testCases = [];
let execResults = null;
let currentMode = 'debug';
let resultFilter = 'all';     // P1：结果筛选
const ROW_H = 36; const BUF = 10;
let vsReady = false;
const HIST_KEY = 'pipe-eval-history';
const TPL_OPEN_KEY = 'pipe-eval-tpl-open';

/* ═══════════════════════════════════════════════════════════════════════════
   6.  Render helpers
═══════════════════════════════════════════════════════════════════════════ */
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function fmtVal(v) { if (v === null) return 'null'; if (v === undefined) return 'undefined'; if (typeof v === 'string') return '"' + v + '"'; return String(v); }

/* P1：根据参数特征推断徽章类型（替换硬编码 SYNC）*/
function inferBadge(placeholder, idx) {
  // 默认 literal；可由用户在下拉中改写，或宿主 postMessage 覆盖
  return badgeTypes[idx] || 'literal';
}
const BADGE_LABEL = { sync:'SYNC', ref:'REF', const:'CONST', literal:'LITERAL', template:'TEMPLATE' };

function renderInputFields() {
  const c = document.getElementById('inputs-container');
  if (!parsedExpr.ok || !parsedExpr.inputs.length) {
    c.innerHTML = '<p class="muted-note">此表达式无需输入参数</p>';
    inputValues = []; return;
  }
  inputValues = new Array(parsedExpr.inputs.length).fill('');
  if (badgeTypes.length !== parsedExpr.inputs.length) badgeTypes = new Array(parsedExpr.inputs.length).fill('literal');
  c.innerHTML = parsedExpr.inputs.map((inp, i) => {
    const bt = inferBadge(inp.placeholder, i);
    const opts = Object.keys(BADGE_LABEL).map(k => `<option value="${k}" ${k===bt?'selected':''}>${BADGE_LABEL[k]}</option>`).join('');
    return `
    <div class="input-row" id="irow-${i}">
      <div class="input-label">
        <span class="badge badge-${bt}" id="badge-${i}">${BADGE_LABEL[bt]}</span>
        <select class="badge-select" onchange="onBadgeChange(${i}, this.value)" title="参数类型">${opts}</select>
        <span class="pname">$${i+1}</span>
        <span class="phint">(${esc(inp.desc)})</span>
      </div>
      <input type="text" class="input-field" inputmode="text"
        placeholder="输入 $${i+1} 的值" data-idx="${i}"
        oninput="onInput(${i}, this.value)" ${i === 0 ? 'autofocus' : ''}>
      <div class="param-msg" id="pmsg-${i}"></div>
    </div>`;
  }).join('');
}

function onBadgeChange(idx, val) {
  badgeTypes[idx] = val;
  const b = document.getElementById('badge-' + idx);
  b.className = 'badge badge-' + val;
  b.textContent = BADGE_LABEL[val];
}

function renderPipelineSlots() {
  const c = document.getElementById('pipeline-container');
  if (!parsedExpr.ok || !parsedExpr.stages.length) { c.innerHTML = '<p class="muted-note">无管道处理阶段</p>'; return; }
  c.innerHTML = parsedExpr.stages.map((s, i) => `
    <div class="stage" id="stage-${i}">
      <div class="stage-expr">${esc(s.raw)}</div>
      <div class="stage-out waiting" id="sout-${i}">→ 等待输入…</div>
    </div>`).join('');
}

function collectTplVars() {
  const map = new Map();
  templateVars.forEach(({ key, val }) => { if (key) map.set(key, val); });
  return map;
}

function updateDebugResults() {
  const fr = document.getElementById('final-result');
  const cb = document.getElementById('copy-btn');
  const all = inputValues.length > 0 && inputValues.every(v => v !== '' && v !== undefined);

  // 标记空参数行（inline，替换 alert）
  inputValues.forEach((v, i) => {
    const row = document.getElementById('irow-' + i);
    const msg = document.getElementById('pmsg-' + i);
    if (row && msg) {
      const empty = (v === '' || v === undefined);
      row.classList.toggle('warn', empty && _touched);
      msg.classList.toggle('show', empty && _touched);
      if (empty && _touched) msg.textContent = `参数 $${i+1} 未提供`;
    }
  });

  if (!all || !parsedExpr.ok) {
    fr.className = 'final-result waiting'; fr.textContent = '等待输入…';
    cb.classList.add('hidden');
    parsedExpr.stages && parsedExpr.stages.forEach((_, i) => { const el = document.getElementById('sout-' + i); if (el) { el.textContent = '→ 等待输入…'; el.className = 'stage-out waiting'; } });
    return;
  }
  const res = evaluator.evaluate(parsedExpr, inputValues, collectTplVars());
  if (!res.success) {
    fr.className = 'final-result error'; fr.textContent = res.error;
    cb.classList.add('hidden');
  } else {
    res.intermediates.forEach((v, i) => { const el = document.getElementById('sout-' + i); if (el) { el.textContent = '→ ' + fmtVal(v); el.className = 'stage-out'; } });
    fr.className = 'final-result'; fr.textContent = fmtVal(res.result);
    cb.classList.remove('hidden');
  }
}
let _touched = false;

/* ═══════════════════════════════════════════════════════════════════════════
   7.  Event handlers
═══════════════════════════════════════════════════════════════════════════ */
function onInput(idx, val) { _touched = true; inputValues[idx] = val; updateDebugResults(); }

/* P0：inline 表达式校验（替换 alert）*/
function validateExpr(raw) {
  if (!raw.trim()) return { ok: false, msg: '表达式不能为空' };
  const parsed = parsePipeExpr(raw);
  if (!parsed.ok) return { ok: false, msg: '解析失败：' + parsed.error };
  if (!parsed.inputs.length) return { ok: false, msg: '至少需要声明一个输入参数（如 $1）' };
  // 试求值结构：检查未知函数
  for (const st of parsed.stages) {
    const known = ['expr','string.format','string.cmp','string.sub','string.gsub','string.upper','string.lower'];
    if (!known.includes(st.fn)) return { ok: false, msg: `未知函数: ${st.fn}` };
  }
  return { ok: true, msg: `✓ 解析成功 · ${parsed.inputs.length} 个输入 · ${parsed.stages.length} 个阶段`, parsed };
}

function showExprMsg(kind, text) {
  const el = document.getElementById('expr-msg');
  const ta = document.getElementById('expr-input');
  el.className = 'inline-msg show ' + (kind === 'ok' ? 'ok' : 'err');
  const icon = kind === 'ok'
    ? '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5l3 3 7-7"/></svg>'
    : '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v4M8 11h.01"/></svg>';
  el.innerHTML = icon + '<span>' + esc(text) + '</span>';
  ta.classList.toggle('invalid', kind !== 'ok');
}
function clearExprMsg() { const el = document.getElementById('expr-msg'); el.className = 'inline-msg'; document.getElementById('expr-input').classList.remove('invalid'); }

let _exprDebounce = null;
function onExprInput() {
  clearTimeout(_exprDebounce);
  _exprDebounce = setTimeout(() => {
    const raw = document.getElementById('expr-input').value;
    if (!raw.trim()) { clearExprMsg(); return; }
    const v = validateExpr(raw);
    showExprMsg(v.ok ? 'ok' : 'err', v.msg);
  }, 300);
}

function applyExpr() {
  const raw = document.getElementById('expr-input').value.trim();
  const v = validateExpr(raw);
  if (!v.ok) { showExprMsg('err', v.msg); return; }
  showExprMsg('ok', v.msg);
  originalExprText = raw;
  parsedExpr = v.parsed;
  inputValues = []; badgeTypes = []; _touched = false;
  renderInputFields();
  renderPipelineSlots();
  updateDebugResults();
  pushHistory(raw);
  // reset testcase mode
  testCases = []; execResults = null;
  document.getElementById('tc-exec-section').classList.add('hidden');
  document.getElementById('tc-results-section').classList.add('hidden');
  document.getElementById('tc-load-err').classList.remove('show');
}
function resetExpr() { document.getElementById('expr-input').value = originalExprText; clearExprMsg(); applyExpr(); }

function copyResult() {
  const text = document.getElementById('final-result').textContent;
  navigator.clipboard?.writeText(text).then(() => showToast('已复制到剪贴板')).catch(() => showToast('复制失败'));
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btn-debug').classList.toggle('active', mode === 'debug');
  document.getElementById('btn-testcase').classList.toggle('active', mode === 'testcase');
  ['dbg-inputs','dbg-tpl','dbg-pipeline','dbg-result','dbg-history'].forEach(id => document.getElementById(id).classList.toggle('hidden', mode !== 'debug'));
  document.getElementById('tc-container').classList.toggle('hidden', mode !== 'testcase');
}

/* ── Template variable panel ──────────────────────────────────────────────── */
function toggleTplPanel() {
  const p = document.getElementById('dbg-tpl');
  p.classList.toggle('open');
  try { localStorage.setItem(TPL_OPEN_KEY, p.classList.contains('open') ? '1' : '0'); } catch(e){}
}
function renderTplRows() {
  const c = document.getElementById('tpl-rows');
  c.innerHTML = templateVars.map((tv, i) => `
    <div class="tpl-row">
      <input class="tpl-key" placeholder="变量名" value="${esc(tv.key)}" oninput="onTplKey(${i}, this.value)">
      <input class="tpl-val" placeholder="值" value="${esc(tv.val)}" oninput="onTplVal(${i}, this.value)">
      <button class="icon-btn" onclick="removeTplRow(${i})" title="删除">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>`).join('');
}
function addTplRow() { templateVars.push({ key:'', val:'' }); renderTplRows(); }
function removeTplRow(i) { templateVars.splice(i, 1); renderTplRows(); updateDebugResults(); }
function onTplKey(i, v) { templateVars[i].key = v; updateDebugResults(); }
function onTplVal(i, v) { templateVars[i].val = v; updateDebugResults(); }

/* ── History (localStorage) ───────────────────────────────────────────────── */
function loadHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch(e) { return []; } }
function pushHistory(expr) {
  let h = loadHistory();
  h = h.filter(x => x.expr !== expr);
  h.unshift({ expr, ts: Date.now() });
  h = h.slice(0, 8);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch(e){}
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  const c = document.getElementById('history-list');
  if (!h.length) { c.innerHTML = '<div class="history-empty">暂无历史记录，应用表达式后自动保存</div>'; return; }
  c.innerHTML = h.map(x => `
    <div class="history-item" onclick="restoreHistory('${esc(x.expr).replace(/'/g,"\\'")}')">
      <span class="hi-expr">${esc(x.expr)}</span>
      <span class="hi-time">${relTime(x.ts)}</span>
    </div>`).join('');
}
function restoreHistory(expr) { document.getElementById('expr-input').value = expr; applyExpr(); switchMode('debug'); }
function relTime(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  if (d < 86400) return Math.floor(d/3600) + ' 小时前';
  return Math.floor(d/86400) + ' 天前';
}

/* ── Test-case handlers ───────────────────────────────────────────────────── */
function loadTestCases() {
  const text = document.getElementById('tc-input').value.trim();
  const errEl = document.getElementById('tc-load-err');
  errEl.classList.remove('show');
  if (!text) { showErr('请输入测试用例', null); return; }
  const { cases, errors } = parseTestCaseText(text);
  if (!cases.length) { showErr('未能解析到有效的测试用例', errors[0]?.message); return; }
  if (errors.length) { const detail = errors.slice(0, 3).map(e => `第 ${e.line} 行: ${e.message}`).join('\n'); showErr(`加载了 ${cases.length} 条，${errors.length} 条解析失败`, detail); }
  testCases = cases;
  document.getElementById('tc-exec-section').classList.remove('hidden');
  document.getElementById('tc-exec-btn').disabled = false;
  document.getElementById('tc-exec-info').textContent = `已加载 ${cases.length} 条测试用例`;
}
function clearTestCases() {
  testCases = []; execResults = null;
  document.getElementById('tc-input').value = '';
  document.getElementById('tc-exec-section').classList.add('hidden');
  document.getElementById('tc-results-section').classList.add('hidden');
  document.getElementById('tc-load-err').classList.remove('show');
  document.getElementById('tc-exec-info').textContent = '';
}
async function executeBatch() {
  if (!testCases.length) return;
  const btn = document.getElementById('tc-exec-btn');
  btn.disabled = true; btn.innerHTML = '<span class="mono">⏳</span> 执行中…';
  await new Promise(r => setTimeout(r, 0));
  const tpl = collectTplVars();
  const results = testCases.map(tc => {
    const u = { ...tc, executedAt: Date.now() };
    const res = evaluator.evaluate(parsedExpr, tc.inputs.map(String), tpl);
    if (!res.success) { u.executionStatus = 'error'; u.errorMessage = res.error; u.actualOutput = null; u.matchStatus = null; }
    else { u.executionStatus = 'success'; u.actualOutput = String(res.result); u.matchStatus = normOut(u.actualOutput) === normOut(tc.expectedOutput) ? 'match' : 'mismatch'; }
    return u;
  });
  testCases = results;
  const s = { total: 0, success: 0, failed: 0, matched: 0, mismatched: 0 };
  results.forEach(tc => { s.total++; if (tc.executionStatus === 'success') { s.success++; if (tc.matchStatus === 'match') s.matched++; if (tc.matchStatus === 'mismatch') s.mismatched++; } else s.failed++; });
  execResults = { testCases: results, summary: s };
  resultFilter = 'all';
  renderBatchResults();
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 3l9 5-9 5z"/></svg> 执行全部';
}
function normOut(s) { return String(s).trim().replace(/^["']|["']$/g,'').replace(/\s+/g,' '); }
function exportResults() {
  if (!testCases.length) return;
  const lines = testCases.map(tc => [...tc.inputs.map(String), tc.expectedOutput, tc.actualOutput ?? tc.errorMessage ?? ''].join('\t'));
  const text = '#\t输入\t期望输出\t实际输出\n' + lines.join('\n');
  navigator.clipboard?.writeText(text).then(() => showToast('结果已复制到剪贴板')).catch(() => showToast('复制失败'));
}

/* ── Result filter (P1) ───────────────────────────────────────────────────── */
function filteredCases() {
  if (!execResults) return [];
  const all = execResults.testCases;
  switch (resultFilter) {
    case 'match': return all.filter(t => t.matchStatus === 'match');
    case 'mismatch': return all.filter(t => t.matchStatus === 'mismatch');
    case 'error': return all.filter(t => t.executionStatus === 'error');
    default: return all;
  }
}
function setFilter(f) { resultFilter = f; renderFilterBar(); document.getElementById('vc').scrollTop = 0; rerenderRows(); }
function renderFilterBar() {
  const s = execResults.summary;
  const chips = [
    ['all', '全部', s.total],
    ['match', '匹配', s.matched],
    ['mismatch', '不匹配', s.mismatched],
    ['error', '错误', s.failed],
  ];
  document.getElementById('tc-filter').innerHTML = chips.map(([f,l,n]) =>
    `<button class="filter-chip ${resultFilter===f?'active':''}" onclick="setFilter('${f}')">${l}<span class="fc-count">${n}</span></button>`
  ).join('');
}

/* ── Virtual scroll ───────────────────────────────────────────────────────── */
function renderBatchResults() {
  const s = execResults.summary;
  document.getElementById('tc-results-section').classList.remove('hidden');
  document.getElementById('tc-export-btn').classList.remove('hidden');
  document.getElementById('tc-stats').innerHTML = [
    ['合计', s.total, ''], ['成功', s.success, 's-ok'], ['失败', s.failed, 's-fail'],
    ['匹配', s.matched, 's-ok'], ['不匹配', s.mismatched, 's-warn']
  ].map(([l,v,cls]) => `<div class="stat"><div class="stat-v ${cls}">${v}</div><div class="stat-l">${l}</div></div>`).join('');
  renderFilterBar();
  if (!vsReady) { document.getElementById('vc').addEventListener('scroll', handleVScroll); vsReady = true; }
  document.getElementById('vc').scrollTop = 0;
  rerenderRows();
}
function rerenderRows() {
  const cases = filteredCases();
  const end = Math.min(50, cases.length);
  renderRows(0, end, cases);
  updateVFoot(0, end, cases.length);
}
function handleVScroll() {
  if (!execResults) return;
  const cases = filteredCases();
  const c = document.getElementById('vc');
  const start = Math.max(0, Math.floor(c.scrollTop / ROW_H) - BUF);
  const end = Math.min(cases.length, Math.ceil((c.scrollTop + c.clientHeight) / ROW_H) + BUF);
  renderRows(start, end, cases);
  updateVFoot(start, end, cases.length);
}
function renderRows(start, end, cases) {
  const spacer = document.getElementById('vs');
  const content = document.getElementById('vcon');
  spacer.style.height = (cases.length * ROW_H) + 'px';
  content.style.top = (start * ROW_H) + 'px';
  let html = '';
  for (let i = start; i < end && i < cases.length; i++) {
    const tc = cases[i];
    const icon = tc.matchStatus === 'match' ? '✓' : tc.matchStatus === 'mismatch' ? '✗' : tc.executionStatus === 'error' ? '!' : '…';
    const cls = tc.matchStatus === 'match' ? 'mic-ok' : tc.matchStatus === 'mismatch' ? 'mic-fail' : 'mic-err';
    const rowCls = tc.matchStatus === 'mismatch' ? 'mismatch' : tc.executionStatus === 'error' ? 'errored' : '';
    const inp = Array.isArray(tc.inputs) ? tc.inputs.join(' ') : String(tc.inputs);
    const exp = tc.expectedOutput ?? '–';
    const act = tc.actualOutput ?? tc.errorMessage ?? 'pending';
    html += `<div class="vrow ${rowCls}">
      <div class="vcell ci">${i+1}</div>
      <div class="vcell inp" title="${esc(inp)}">${esc(inp)}</div>
      <div class="vcell exp" title="${esc(exp)}">${esc(exp)}</div>
      <div class="vcell act" title="${esc(act)}">${esc(act)}</div>
      <div class="vcell st"><span class="mic ${cls}">${icon}</span></div>
    </div>`;
  }
  content.innerHTML = html;
}
function updateVFoot(start, end, total) {
  document.getElementById('vrange').textContent = total ? `显示 ${start+1}–${Math.min(end, total)} / 共 ${total}` : '无匹配结果';
  document.getElementById('vhint').textContent = total > 50 ? '滚动加载更多' : '';
}

/* ── Misc ─────────────────────────────────────────────────────────────────── */
function showErr(msg, detail) {
  const el = document.getElementById('tc-load-err');
  el.innerHTML = `<strong>⚠ ${esc(msg)}</strong>${detail ? '<div class="err-detail">' + esc(detail) + '</div>' : ''}`;
  el.classList.add('show');
}
let _toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ── Theme switch (P1 — dark/light/glass) ─────────────────────────────────── */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-seg button').forEach(b => b.classList.toggle('active', b.dataset.themeVal === t));
  try { localStorage.setItem('pipe-eval-theme', t); } catch(e){}
}

/* ── Keyboard shortcuts (P0) ──────────────────────────────────────────────── */
document.addEventListener('keydown', (e) => {
  // Ctrl/Cmd+Enter → 应用表达式
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (currentMode === 'debug') applyExpr(); }
  // F5 → 执行批量（用例模式）
  if (e.key === 'F5' && currentMode === 'testcase' && testCases.length) { e.preventDefault(); executeBatch(); }
});

/* ── postMessage 宿主桥（打开 setTemplateVars / setExpression 通道）────────── */
window.addEventListener('message', (event) => {
  const msg = event.data || {};
  if (msg.type === 'setTemplateVars' && msg.payload) {
    templateVars = Object.entries(msg.payload).map(([key, val]) => ({ key, val: String(val) }));
    if (!document.getElementById('dbg-tpl').classList.contains('open')) toggleTplPanel();
    renderTplRows(); updateDebugResults();
  }
  if (msg.type === 'setExpression' && typeof msg.payload === 'string') {
    document.getElementById('expr-input').value = msg.payload; applyExpr();
  }
  if (msg.type === 'setBadgeTypes' && Array.isArray(msg.payload)) {
    badgeTypes = msg.payload.slice(); renderInputFields(); updateDebugResults();
  }
});

/* ── Init ─────────────────────────────────────────────────────────────────── */
(function init() {
  try { const t = localStorage.getItem('pipe-eval-theme'); if (t) setTheme(t); } catch(e){}
  try { if (localStorage.getItem(TPL_OPEN_KEY) === '1') document.getElementById('dbg-tpl').classList.add('open'); } catch(e){}
  parsedExpr = parsePipeExpr(originalExprText);
  renderInputFields();
  renderTplRows();
  renderPipelineSlots();
  renderHistory();
  updateDebugResults();
  document.getElementById('expr-input').addEventListener('input', onExprInput);
})();
</script>
